<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
    html, body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: transparent;
        color: #111111;
        overflow: hidden;
    }

    .scan-wrap {
        background: transparent;
        box-sizing: border-box;
        width: 100%;
    }

    .scan-button {
        width: 100%;
        display: inline-block;
        background: #111111;
        color: white;
        border: 1px solid #111111;
        border-radius: 10px;
        padding: 8px 10px;
        font-weight: 800;
        cursor: pointer;
        font-size: 13px;
        line-height: 1.2;
    }

    .scan-button:hover {
        background: black;
        color: #FFD700;
        border-color: #FFD700;
    }

    .scanner-panel {
        display: none;
        margin-top: 8px;
        background: #ffffff;
        border: 1px solid #d0d0d0;
        border-radius: 12px;
        padding: 10px;
        box-sizing: border-box;
        width: 100%;
        box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    }

    .scan-title {
        font-size: 13px;
        font-weight: 800;
        margin-bottom: 8px;
        color: #111111;
    }

    #reader {
        width: 100%;
        min-height: 340px;
        max-width: 560px;
        margin: 0 auto;
        overflow: hidden;
        border-radius: 12px;
        background: #111111;
        position: relative;
    }

    #reader video {
        object-fit: cover !important;
        width: 100% !important;
        min-height: 340px !important;
        border-radius: 12px !important;
    }

    #reader canvas {
        border-radius: 12px !important;
    }

    .msg {
        color: #333333;
        font-size: 12px;
        margin-top: 8px;
        word-break: break-word;
        line-height: 1.35;
    }

    .result-box {
        display: none;
        margin-top: 8px;
        padding: 8px;
        border: 1px solid #e0e0e0;
        border-radius: 10px;
        background: #f7f7f7;
        font-size: 12px;
    }

    .result-value {
        font-family: Consolas, monospace;
        font-size: 14px;
        font-weight: 800;
        color: #111111;
        word-break: break-all;
    }
</style>
</head>
<body>
<div class="scan-wrap">
    <button id="scan-button" class="scan-button" type="button" onclick="toggleScan()">📷 Skeniraj</button>

    <div id="scanner-panel" class="scanner-panel">
        <div id="scan-title" class="scan-title">📷 Skener</div>
        <div id="reader"></div>
        <div id="msg" class="msg">Uperi kameru u barkod.</div>
    </div>
</div>

<script>
let html5QrCode = null;
let running = false;
let alreadyRead = false;
let currentArgs = {};
let heightTimer = null;

function postStreamlitMessage(message) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true }, message), "*");
}

function streamlitReady() {
    postStreamlitMessage({
        type: "streamlit:componentReady",
        apiVersion: 1
    });
}

function setFrameHeight(forceHeight) {
    let h = forceHeight || 58;
    if (running) {
        h = 475;
    } else {
        const panel = document.getElementById("scanner-panel");
        if (panel && panel.style.display === "block") {
            h = 475;
        }
    }

    postStreamlitMessage({
        type: "streamlit:setFrameHeight",
        height: h
    });
}

function keepHeightWhileScanning() {
    if (heightTimer) clearInterval(heightTimer);
    heightTimer = setInterval(() => {
        if (!running) {
            clearInterval(heightTimer);
            heightTimer = null;
            setFrameHeight(58);
            return;
        }
        setFrameHeight(475);
    }, 500);
}

function setComponentValue(value) {
    postStreamlitMessage({
        type: "streamlit:setComponentValue",
        value: value,
        dataType: "json"
    });
}

function render(args) {
    currentArgs = args || {};
    const label = currentArgs.label || "barkod";
    document.getElementById("scan-title").innerText = "📷 Skener za: " + label;
    document.getElementById("scan-button").innerText = "📷 Skeniraj";
    setTimeout(() => setFrameHeight(58), 50);
}

window.addEventListener("message", (event) => {
    const data = event.data || {};
    if (data.type === "streamlit:render") {
        render(data.args || {});
    }
});

function showPanel() {
    document.getElementById("scanner-panel").style.display = "block";
    setFrameHeight(475);
}

function hidePanel() {
    document.getElementById("scanner-panel").style.display = "none";
    setFrameHeight(58);
}

function showResult(value) {
    const msg = document.getElementById("msg");
    if (msg) msg.innerText = "";
}

function onScanSuccess(decodedText, decodedResult) {
    const clean = (decodedText || "").trim();
    if (!clean || alreadyRead) return;

    alreadyRead = true;
    showResult(clean);

    stopScan(false).then(() => {
        setComponentValue(clean);
        // Komponenta će se posle toga rerun-ovati i polje će se popuniti.
    });
}

function makeConfig() {
    return {
        fps: 12,
        qrbox: function(viewfinderWidth, viewfinderHeight) {
            const boxWidth = Math.max(220, Math.min(Math.floor(viewfinderWidth * 0.88), 420));
            const boxHeight = Math.max(90, Math.min(Math.floor(viewfinderHeight * 0.28), 150));
            return { width: boxWidth, height: boxHeight };
        },
        experimentalFeatures: {
            useBarCodeDetectorIfSupported: true
        },
        formatsToSupport: [
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.CODE_39,
            Html5QrcodeSupportedFormats.CODE_93,
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.QR_CODE
        ]
    };
}

function startScan() {
    if (running) return;

    alreadyRead = false;
    const resultBox = document.getElementById("result");
    if (resultBox) resultBox.style.display = "none";
    document.getElementById("msg").innerText = "Pokrećem kameru...";
    document.getElementById("scan-button").innerText = "✖ Zatvori kameru";
    showPanel();
    keepHeightWhileScanning();

    html5QrCode = new Html5Qrcode("reader", false);
    const config = makeConfig();

    const startWithCamera = (cameraConfig) => {
        return html5QrCode.start(cameraConfig, config, onScanSuccess, () => {})
            .then(() => {
                running = true;
                document.getElementById("msg").innerText = "Kamera je aktivna. Uperi barkod u uokvireni deo.";
                setTimeout(() => setFrameHeight(475), 250);
                setTimeout(() => setFrameHeight(475), 800);
            });
    };

    // Prvo pokušaj zadnju kameru direktno. Ako browser to odbije, koristi listu kamera.
    startWithCamera({ facingMode: "environment" }).catch(() => {
        Html5Qrcode.getCameras().then(cameras => {
            if (!cameras || cameras.length === 0) {
                document.getElementById("msg").innerText = "Kamera nije pronađena.";
                document.getElementById("scan-button").innerText = "📷 Skeniraj";
                hidePanel();
                return;
            }

            let cameraId = cameras[cameras.length - 1].id;
            for (const cam of cameras) {
                const label = (cam.label || "").toLowerCase();
                if (label.includes("back") || label.includes("rear") || label.includes("environment") || label.includes("zadnja")) {
                    cameraId = cam.id;
                    break;
                }
            }

            startWithCamera(cameraId).catch(err => {
                document.getElementById("msg").innerText = "Ne mogu da otvorim kameru: " + err;
                document.getElementById("scan-button").innerText = "📷 Skeniraj";
                setFrameHeight(475);
            });
        }).catch(err => {
            document.getElementById("msg").innerText = "Greška pri čitanju kamera: " + err;
            document.getElementById("scan-button").innerText = "📷 Skeniraj";
            setFrameHeight(475);
        });
    });
}

async function stopScan(collapse = true) {
    if (html5QrCode) {
        try {
            await html5QrCode.stop();
        } catch(e) {}
        try {
            await html5QrCode.clear();
        } catch(e) {}
    }

    running = false;
    html5QrCode = null;
    document.getElementById("scan-button").innerText = "📷 Skeniraj";

    if (collapse) {
        hidePanel();
    } else {
        setFrameHeight(475);
    }
}

function toggleScan() {
    if (running) {
        stopScan(true);
    } else {
        startScan();
    }
}

streamlitReady();
setTimeout(() => setFrameHeight(58), 100);
</script>
</body>
</html>
